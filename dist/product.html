<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View New Balance product details, choose a size, and add to cart.">
  <title>Product — New Balance</title>
  <link rel="icon" href="assets/nb-mark.svg">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="product">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main" class="product-page">
    <nav class="breadcrumbs section-shell" aria-label="Breadcrumb">
      <a href="index.html">Home</a><span>/</span><a href="shop.html">Products</a><span>/</span><span
        id="breadcrumb-name">Product</span>
    </nav>
    <section id="product-detail" class="product-detail section-shell" aria-live="polite">
      <div class="detail-loading">
        <div class="skeleton-block"></div>
        <div class="skeleton-copy"></div>
      </div>
    </section>
    <section class="detail-info section-shell" id="detail-info" hidden></section>
    <section class="related section-shell" aria-labelledby="related-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Keep exploring</p>
          <h2 id="related-heading">You may also like</h2>
        </div>
        <a class="text-link" href="shop.html">Shop all <span>→</span></a>
      </div>
      <div id="related-products" class="product-grid product-grid-compact"></div>
    </section>
  </main>
  <div id="site-footer"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>

</html>
