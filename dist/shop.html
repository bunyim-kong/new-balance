<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Shop New Balance shoes, apparel, and accessories for men, women, and kids.">
  <title>Shop Products — New Balance</title>
  <link rel="icon" href="assets/nb-mark.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="shop">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <section class="shop-hero">
      <div class="section-shell">
        <p class="eyebrow">New Balance collection</p>
        <h1>Find your next favorite.</h1>
        <p>Everyday icons, performance apparel, and essential accessories—all in one collection.</p>
      </div>
    </section>

    <section class="shop section-shell" aria-labelledby="shop-heading">
      <div class="section-heading shop-heading">
        <div>
          <p class="eyebrow">Shop the collection</p>
          <h2 id="shop-heading">All products.</h2>
        </div>
        <p id="product-count" class="result-count" aria-live="polite">Loading products…</p>
      </div>

      <div class="catalog-toolbar">
        <div class="filter-pills" role="group" aria-label="Filter products">
          <button class="filter-pill is-active" type="button" data-filter="all">All</button>
          <button class="filter-pill" type="button" data-filter="men">Men</button>
          <button class="filter-pill" type="button" data-filter="women">Women</button>
          <button class="filter-pill" type="button" data-filter="kids">Kids</button>
          <button class="filter-pill" type="button" data-filter="shoes">Shoes</button>
          <button class="filter-pill" type="button" data-filter="apparel">Apparel</button>
          <button class="filter-pill" type="button" data-filter="accessories">Accessories</button>
        </div>
        <div class="catalog-controls">
          <label class="search-control">
            <span class="sr-only">Search products</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
            <input id="product-search" type="search" placeholder="Search styles">
          </label>
          <label class="sort-control">
            <span class="sr-only">Sort products</span>
            <select id="product-sort">
              <option value="featured">Featured</option>
              <option value="newest">Newest</option>
              <option value="price-low">Price: low to high</option>
              <option value="price-high">Price: high to low</option>
            </select>
          </label>
        </div>
      </div>

      <div id="product-grid" class="product-grid" aria-live="polite">
        <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
