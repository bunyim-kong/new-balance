<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review your New Balance shopping cart.">
  <title>Your Cart — New Balance</title>
  <link rel="icon" href="assets/nb-mark.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main" class="cart-page section-shell">
    <div class="cart-title">
      <div><p class="eyebrow">Your selection</p><h1>Shopping cart</h1></div>
      <a class="text-link" href="shop.html">Continue shopping <span>→</span></a>
    </div>
    <div id="cart-layout" class="cart-layout" aria-live="polite"></div>
  </main>
  <div id="checkout-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="checkout-title">
      <button class="modal-close" type="button" aria-label="Close checkout" data-close-modal>×</button>
      <p class="eyebrow">Demo checkout</p>
      <h2 id="checkout-title">Almost yours.</h2>
      <p>This static demo does not collect payment. Complete the form to preview the final order step.</p>
      <form id="checkout-form" class="checkout-form">
        <label>Full name<input name="name" required autocomplete="name"></label>
        <label>Email address<input name="email" type="email" required autocomplete="email"></label>
        <label class="field-full">Shipping address<input name="address" required autocomplete="street-address"></label>
        <label>City<input name="city" required autocomplete="address-level2"></label>
        <label>Postal code<input name="postal" required autocomplete="postal-code"></label>
        <button class="button button-dark field-full" type="submit">Place demo order</button>
      </form>
    </section>
  </div>
  <div id="site-footer"></div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
